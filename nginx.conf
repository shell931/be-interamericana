server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirección desde la raíz hacia /swiftly/home
    location = / {
        return 301 /swiftly/home;
    }

    # Manejar rutas de Angular en /swiftly
    location /swiftly {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /swiftly/index.html;

        # Archivos estáticos con cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public";
        }
    }

    # Fallback para cualquier otra ruta no específica
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /swiftly/home;
    }
} 
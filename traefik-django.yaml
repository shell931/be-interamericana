version: '3'

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.dashboard=true"
      - "--accesslog=true"
      - "--log.level=DEBUG"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=wp_network"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=desarrolloartech@gmail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/home/interamericana/traefik/letsencrypt:/letsencrypt"
    networks:
      - wp_network
    restart: unless-stopped

  wordpress:
    image: wordpress:php8.2-apache
    container_name: interamericana_wp
    environment:
      WORDPRESS_DB_HOST: webs.cbocak8iw8tf.us-east-1.rds.amazonaws.com
      WORDPRESS_DB_USER: carriero
      WORDPRESS_DB_PASSWORD: Taylor2023%
      WORDPRESS_DB_NAME: interamericanav3
      WORDPRESS_TABLE_PREFIX: wp_
      VIRTUAL_HOST: interamericana.store,www.interamericana.store
      LETSENCRYPT_HOST: interamericana.store,www.interamericana.store
      LETSENCRYPT_EMAIL: desarrolloartech@gmail.com
    volumes:
      - /home/interamericana/interamericana/wp-content:/var/www/html/wp-content
      - /home/interamericana/interamericana/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.interamericana.rule=Host(`interamericana.store`,`www.interamericana.store`)"
      - "traefik.http.routers.interamericana.entrypoints=websecure"
      - "traefik.http.routers.interamericana.tls=true"
      - "traefik.http.routers.interamericana.tls.certresolver=myresolver"
      - "traefik.http.services.interamericana.loadbalancer.server.port=80"
      - "traefik.docker.network=wp_network"
    networks:
      - wp_network
    restart: unless-stopped

  django_app:
    build: 
      context: /home/market/be-market
      dockerfile: Dockerfile
    container_name: django_app
    expose:
      - "8000"  # Gunicorn usa este puerto por defecto
    volumes:
      - /home/market/be-market/static:/code/static
      - /home/market/be-market:/code
    environment:
      - DJANGO_SETTINGS_MODULE=commerce.settings  # Asegúrate de que esto sea correcto
      - PYTHONUNBUFFERED=1
      - USE_TZ=True
      - TZ=UTC
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.django.rule=Host(`ofertas-swiftly.com`,`www.ofertas-swiftly.com`) && (PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.django.entrypoints=websecure"
      - "traefik.http.routers.django.tls.certresolver=myresolver"
      - "traefik.http.routers.django.priority=15"
      - "traefik.http.services.django.loadbalancer.server.port=8000"  # ¡Importante! Cambiado de 80 a 8000
    networks:
      - wp_network
    restart: unless-stopped

  fe-market:
    image: nginx:latest
    container_name: fe-market
    restart: always
    volumes:
      - ./dist:/usr/share/nginx/html  # Archivos estáticos Angular
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Configuración personalizada de Nginx
    labels:
      # Habilita Traefik
      - "traefik.enable=true"
      # Router para manejar tanto la raíz como /swiftly
      - "traefik.http.routers.fe-market.rule=Host(`ofertas-swiftly.com`, `www.ofertas-swiftly.com`)"
      - "traefik.http.routers.fe-market.entrypoints=websecure"
      - "traefik.http.routers.fe-market.tls.certresolver=myresolver"
      - "traefik.http.routers.fe-market.priority=5"
      - "traefik.http.services.fe-market.loadbalancer.server.port=80"
    networks:
      - wp_network

networks:
  wp_network:
    name: wp_network
    external: true